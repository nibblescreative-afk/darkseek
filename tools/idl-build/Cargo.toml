[package]
name = "idl-build"
version = "0.1.0"
edition = "2021"
description = "Writes the Anchor IDL of a program crate, as `anchor idl build` does"
license = "BUSL-1.1"
publish = false

# not part of the program workspace: it runs on the host and shells out to cargo
[workspace]

[dependencies]
anchor-lang-idl = { version = "=0.1.4", features = ["build"] }
serde_json = "1"
