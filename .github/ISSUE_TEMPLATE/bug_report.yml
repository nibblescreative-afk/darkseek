name: Bug report
description: Something in the game, the program, the SDK, the indexer or the docs is wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Found a way to take or lock someone's funds? Do not file it here: report it privately (see SECURITY.md).
  - type: dropdown
    id: part
    attributes:
      label: Where
      options:
        - The game (thedarkseek.xyz)
        - Program (programs/darkseek-vault)
        - SDK or darkseek-verify
        - Indexer
        - Docs or white paper
        - Scripts, CI or releases
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: For the game, the room, your side and character, your browser and what you did. For the code, commands, a transaction signature or a test, and which cluster.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.2.1, a commit hash, or when you played
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: shell
