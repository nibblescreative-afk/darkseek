# The program, the scripts and the indexer against a real local validator, and
# the time dependent paths in LiteSVM. Heavier than CI: it installs the Agave
# toolchain (pinned and cached) and builds the program for SBF.
name: Validator

on:
  push:
    branches: [main]
  # every pull request, so its required check always reports: one that changes
  # nothing the validator checks skips that job (the changes job decides), and a
  # job skipped by its condition counts as passed, where a workflow skipped by a
  # paths filter never reports at all and holds the pull request
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validator-${{ github.ref }}
  cancel-in-progress: true

env:
  AGAVE_VERSION: 4.4.1

jobs:
  changes:
    name: What the pull request changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.paths.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: paths
        name: Does it touch the program, the SDK, the indexer, the scripts or the tests
        env:
          EVENT: ${{ github.event_name }}
        run: |
          # a push to main or a manual run always runs the validator; a pull request
          # (checked out as its merge commit, so HEAD^1 is main) runs it when it
          # touches what the validator checks, or when its files cannot be listed.
          # Every path as it is (no quoting) and both sides of a rename, so a file
          # moved out of programs/ still counts as a program change.
          run=true
          files=
          if [ "$EVENT" = pull_request ] && files=$(git -c core.quotePath=false diff --no-renames --name-only -z HEAD^1 HEAD | tr '\0' '\n') && [ -n "$files" ]; then
            case "$(grep -cE '^(programs/|packages/sdk/|apps/indexer/|tests/|scripts/|Cargo\.(toml|lock)$|package(-lock)?\.json$|\.github/workflows/validator\.yml$)' <<< "$files")" in
              0) run=false ;;
            esac
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "validator runs: $run"
          printf '%s\n' "$files"

  validator:
    name: Program, scripts and indexer on a local validator
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: changes
    # skipped, which counts as passed, only when a pull request changes nothing it checks
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.run != 'false') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Rust 1.100.0
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          rustup default 1.100.0
      - name: Cache the Agave toolchain and platform tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/share/solana
            ~/.cache/solana
          key: agave-${{ env.AGAVE_VERSION }}-${{ runner.os }}
      - name: Install Agave ${{ env.AGAVE_VERSION }}
        run: |
          if [ ! -x "$HOME/.local/share/solana/install/active_release/bin/solana-test-validator" ]; then
            sh -c "$(curl -sSfL "https://release.anza.xyz/v${AGAVE_VERSION}/install")"
          fi
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-sbf-${{ runner.os }}-${{ env.AGAVE_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-sbf-${{ runner.os }}-${{ env.AGAVE_VERSION }}-
      - run: solana --version && cargo build-sbf --version
      - run: scripts/build-program.sh
      - run: npm ci
      - run: npm run build -w @darkseek/sdk
      - name: LiteSVM (stale rounds, sessions, vesting, the auction over time)
        run: npx tsx --test tests/timelocks.test.ts
      - name: Fuzzing in LiteSVM (random instruction sequences, books checked after every step)
        run: npx tsx --test tests/invariants.test.ts
      - name: The program on a local validator
        run: npx tsx --test tests/protocol.test.ts
      - name: $DS creation, cluster setup and NFT checks on a local validator
        run: npx tsx --test tests/token.test.ts
      - name: The indexer on a local validator
        run: npm test -w @darkseek/indexer
      - name: An upgrade in place from the latest release, in LiteSVM
        env:
          PREVIOUS_RELEASE: v0.3.0
        run: |
          prev="$RUNNER_TEMP/previous-release"
          mkdir -p "$prev"
          base="https://github.com/nibblescreative-afk/darkseek/releases/download/$PREVIOUS_RELEASE"
          curl -fsSL -o "$prev/darkseek_vault.so" "$base/darkseek_vault.so"
          curl -fsSL -o "$prev/SHA256SUMS" "$base/SHA256SUMS"
          (cd "$prev" && grep ' darkseek_vault.so$' SHA256SUMS | sha256sum -c -)
          DS_PREVIOUS_SO="$prev/darkseek_vault.so" npx tsx --test tests/upgrade.test.ts
